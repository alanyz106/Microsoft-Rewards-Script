name: Daily Rewards

on:
  schedule:
    - cron: '5 8 * * *'   # 每天 UTC 8:05（北京时间 16:05，微软每日配额重置后执行）
  workflow_dispatch:        # 支持手动触发及自动补跑重试
    inputs:
      is_retry:
        description: 'Whether this run is an automatic retry'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read
  actions: write

env:
  NODE_VERSION: '24'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-npm
        with:
          path: node_modules
          key: npm-${{ hashFiles('package-lock.json') }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: cache-browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Cache sessions
        uses: actions/cache@v4
        id: cache-sessions
        with:
          path: dist/browser/sessions
          key: sessions-${{ github.run_id }}
          restore-keys: sessions-

      - name: Install dependencies
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm install

      - name: Install Chromium
        if: steps.cache-browsers.outputs.cache-hit != 'true'
        run: npx patchright install chromium

      - name: Create accounts.json
        run: |
          node -e "
          const accounts = [];
          let i = 1;
          while (process.env['ACCOUNT_' + i + '_EMAIL']) {
            const proxyUrl = process.env['ACCOUNT_' + i + '_PROXY_URL'] || process.env['DEFAULT_PROXY_URL'] || 'http://47.95.206.224';
            const proxyPort = parseInt(process.env['ACCOUNT_' + i + '_PROXY_PORT'] || process.env['DEFAULT_PROXY_PORT'] || '45001', 10);
            const proxyUsername = process.env['ACCOUNT_' + i + '_PROXY_USERNAME'] || process.env['DEFAULT_PROXY_USERNAME'] || '';
            const proxyPassword = process.env['ACCOUNT_' + i + '_PROXY_PASSWORD'] || process.env['DEFAULT_PROXY_PASSWORD'] || '';
            const proxyAxiosRaw = process.env['ACCOUNT_' + i + '_PROXY_AXIOS'] || process.env['DEFAULT_PROXY_AXIOS'];
            const proxyAxios = proxyAxiosRaw !== undefined ? proxyAxiosRaw === 'true' : Boolean(proxyUrl);

            accounts.push({
              email: process.env['ACCOUNT_' + i + '_EMAIL'],
              password: process.env['ACCOUNT_' + i + '_PASSWORD'],
              totpSecret: process.env['ACCOUNT_' + i + '_TOTP'] || '',
              recoveryEmail: process.env['ACCOUNT_' + i + '_RECOVERY_EMAIL'] || '',
              geoLocale: process.env['ACCOUNT_' + i + '_GEO_LOCALE'] || 'CN',
              langCode: process.env['ACCOUNT_' + i + '_LANG_CODE'] || 'zh-CN',
              proxy: {
                proxyAxios: proxyAxios,
                url: proxyUrl,
                port: proxyPort,
                username: proxyUsername,
                password: proxyPassword
              },
              saveFingerprint: {
                mobile: true,
                desktop: true
              }
            });
            i++;
          }
          if (accounts.length === 0) {
            console.error('No accounts found. Set ACCOUNT_1_EMAIL and ACCOUNT_1_PASSWORD secrets.');
            process.exit(1);
          }
          console.log('Found ' + accounts.length + ' account(s)');
          require('fs').writeFileSync('src/accounts.json', JSON.stringify(accounts, null, 2));
          "
        env:
          ACCOUNT_1_EMAIL: ${{ secrets.ACCOUNT_1_EMAIL }}
          ACCOUNT_1_PASSWORD: ${{ secrets.ACCOUNT_1_PASSWORD }}
          ACCOUNT_1_TOTP: ${{ secrets.ACCOUNT_1_TOTP }}
          ACCOUNT_1_RECOVERY_EMAIL: ${{ secrets.ACCOUNT_1_RECOVERY_EMAIL }}
          ACCOUNT_1_GEO_LOCALE: ${{ secrets.ACCOUNT_1_GEO_LOCALE }}
          ACCOUNT_1_LANG_CODE: ${{ secrets.ACCOUNT_1_LANG_CODE }}
          ACCOUNT_1_PROXY_URL: ${{ secrets.ACCOUNT_1_PROXY_URL }}
          ACCOUNT_1_PROXY_PORT: ${{ secrets.ACCOUNT_1_PROXY_PORT }}
          ACCOUNT_1_PROXY_USERNAME: ${{ secrets.ACCOUNT_1_PROXY_USERNAME }}
          ACCOUNT_1_PROXY_PASSWORD: ${{ secrets.ACCOUNT_1_PROXY_PASSWORD }}
          ACCOUNT_1_PROXY_AXIOS: ${{ secrets.ACCOUNT_1_PROXY_AXIOS }}

          DEFAULT_PROXY_URL: ${{ secrets.DEFAULT_PROXY_URL }}
          DEFAULT_PROXY_PORT: ${{ secrets.DEFAULT_PROXY_PORT }}
          DEFAULT_PROXY_USERNAME: ${{ secrets.DEFAULT_PROXY_USERNAME }}
          DEFAULT_PROXY_PASSWORD: ${{ secrets.DEFAULT_PROXY_PASSWORD }}
          DEFAULT_PROXY_AXIOS: ${{ secrets.DEFAULT_PROXY_AXIOS }}

          ACCOUNT_2_EMAIL: ${{ secrets.ACCOUNT_2_EMAIL }}
          ACCOUNT_2_PASSWORD: ${{ secrets.ACCOUNT_2_PASSWORD }}
          ACCOUNT_2_TOTP: ${{ secrets.ACCOUNT_2_TOTP }}
          ACCOUNT_2_RECOVERY_EMAIL: ${{ secrets.ACCOUNT_2_RECOVERY_EMAIL }}
          ACCOUNT_2_GEO_LOCALE: ${{ secrets.ACCOUNT_2_GEO_LOCALE }}
          ACCOUNT_2_LANG_CODE: ${{ secrets.ACCOUNT_2_LANG_CODE }}
          ACCOUNT_2_PROXY_URL: ${{ secrets.ACCOUNT_2_PROXY_URL }}
          ACCOUNT_2_PROXY_PORT: ${{ secrets.ACCOUNT_2_PROXY_PORT }}
          ACCOUNT_2_PROXY_USERNAME: ${{ secrets.ACCOUNT_2_PROXY_USERNAME }}
          ACCOUNT_2_PROXY_PASSWORD: ${{ secrets.ACCOUNT_2_PROXY_PASSWORD }}
          ACCOUNT_2_PROXY_AXIOS: ${{ secrets.ACCOUNT_2_PROXY_AXIOS }}
          # 如果有多个账号，按 ACCOUNT_3_*、ACCOUNT_4_* 规律添加

      - name: Create config.json
        run: |
          node -e "
          const cfg = {
            baseURL: 'https://rewards.bing.com',
            sessionPath: 'sessions',
            headless: true, clusters: 1,
            globalTimeout: '30sec', errorDiagnostics: false,
            ensureStreakProtection: true,
            workers: {
              doDailySet: true, doClaimBonusPoints: true,
              doSpecialPromotions: true, doMorePromotions: true,
              doPunchCards: true, doAppPromotions: true,
              doDesktopSearch: true, doMobileSearch: true,
              doDailyCheckIn: true, doReadToEarn: true
            },
            searchOnBingLocalQueries: false,
            searchSettings: {
              scrollRandomResults: false, clickRandomResults: false,
              parallelSearching: true,
              queryEngines: ['google', 'wikipedia', 'reddit', 'local'],
              searchResultVisitTime: '10sec',
              searchDelay: { min: '30sec', max: '1min' },
              readDelay: { min: '30sec', max: '1min' }
            },
            debugLogs: false,
            proxy: { queryEngine: true },
            webhook: {
              discord: {
                enabled: ${{ secrets.DISCORD_ENABLED == 'true'}},
                url: '${{ secrets.DISCORD_WEBHOOK_URL }}'
              },
              ntfy: {
                enabled: ${{ secrets.NTFY_ENABLED == 'true'}},
                url: '${{ secrets.NTFY_URL }}',
                topic: '${{ secrets.NTFY_TOPIC }}',
                token: '${{ secrets.NTFY_TOKEN }}',
                title: 'Microsoft-Rewards-Script',
                tags: ['bot', 'notify'], priority: 3
              },
              wxpusher: {
                enabled: ${{ secrets.WXPUSHER_ENABLED == 'true'}},
                appToken: '${{ secrets.WXPUSHER_APPTOKEN }}',
                uids: '${{ secrets.WXPUSHER_UIDS }}'.split(',').filter(Boolean),
                contentType: 1
              },
              webhookLogFilter: {
                enabled: false, mode: 'whitelist',
                levels: ['error'],
                keywords: ['starting account', 'select number', 'collected'],
                regexPatterns: []
              }
            }
          };
          require('fs').writeFileSync('src/config.json', JSON.stringify(cfg, null, 2));
          "

      - name: Build
        run: npx tsc

      - name: Run
        id: run-script
        run: node ./dist/index.js

      - name: Check and Trigger Retry
        if: always() && steps.run-script.outputs.need_retry == 'true' && github.event.inputs.is_retry != 'true' && github.event.inputs.is_retry != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Detected account(s) gaining < 200 points on first run."
          echo "Waiting 5 minutes before triggering retry workflow to allow Microsoft Rewards servers to refresh..."
          sleep 300
          gh workflow run "Daily Rewards" --ref ${{ github.ref_name }} -f is_retry=true

